{% extends "base.html" %}
{% block content %}
{% include "partials/status_panel.html" %}

<style>
  .status-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
  }

  .status-panel {
    max-width: 480px;
    text-align: center;
    padding: 3rem 2.5rem;
  }

  /* Status Icon */
  .status-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 96px;
    height: 96px;
    border-radius: 24px;
    margin-bottom: var(--space-xl);
  }

  .status-icon.success {
    background: linear-gradient(135deg, rgba(107, 255, 158, 0.15), rgba(107, 255, 158, 0.05));
    color: var(--accent-tertiary);
  }

  .status-icon.error {
    background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(255, 107, 107, 0.05));
    color: var(--accent);
  }

  .status-icon.processing {
    background: linear-gradient(135deg, rgba(107, 181, 255, 0.15), rgba(192, 107, 255, 0.05));
    color: var(--accent-cool);
  }

  .spin {
    animation: spin 1.5s linear infinite;
  }

  @keyframes spin {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }

  /* Title */
  .status-panel h2 {
    font-family: var(--font-display);
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: var(--space-xs);
    background: linear-gradient(180deg, var(--text-primary) 0%, rgba(255, 255, 255, 0.8) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .status-subtitle {
    color: var(--text-tertiary);
    font-size: 0.95rem;
    margin-bottom: var(--space-xl);
  }

  /* Progress */
  .progress-wrapper {
    margin-bottom: var(--space-xl);
  }

  .progress {
    height: 10px;
    background: var(--bg-deep);
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: var(--space-md);
  }

  .progress .bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-secondary), var(--accent-tertiary));
    background-size: 200% 100%;
    animation: shimmer 2s ease-in-out infinite;
    border-radius: 100px;
    transition: width 0.5s var(--ease-out);
  }

  @keyframes shimmer {
    0% {
      background-position: 200% 0;
    }

    100% {
      background-position: -200% 0;
    }
  }

  .progress-text {
    font-size: 0.85rem;
    color: var(--text-tertiary);
  }

  .progress-count {
    font-weight: 600;
    color: var(--text-secondary);
  }

  /* Status Messages */
  .status-message {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: var(--space-md) var(--space-lg);
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    margin-bottom: var(--space-xl);
  }

  .success-message {
    background: rgba(107, 255, 158, 0.08);
    border: 1px solid rgba(107, 255, 158, 0.2);
    color: var(--accent-tertiary);
  }

  .error-message {
    background: rgba(255, 107, 107, 0.08);
    border: 1px solid rgba(255, 107, 107, 0.2);
    color: var(--accent);
  }

  .processing-message {
    background: rgba(107, 181, 255, 0.08);
    border: 1px solid rgba(107, 181, 255, 0.2);
    color: var(--accent-cool);
  }

  /* Actions */
  .status-actions {
    display: flex;
    gap: var(--space-md);
    justify-content: center;
    flex-wrap: wrap;
  }

  .refresh-btn {
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {

    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.7;
    }
  }
</style>
{% endblock %}
