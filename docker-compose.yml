# AnkiSpark: one Flask container. Generation runs on a background thread inside the web
# process, so there is no queue, broker, or worker service to run.
# Quick start:
#   cp example.env .env   # then set SECRET_KEY and OPENROUTER_API_KEY
#   docker compose up --build
# App is served at http://localhost:5000

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # SQLite DB + uploads, persisted across restarts.
      - ankigpt-data:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ankigpt-data:
